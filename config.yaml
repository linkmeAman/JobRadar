telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}

scraping:
  # Four rotating role searches plus the always-run Indeed search are processed
  # every run.
  searches_per_run: 4
  cooldown_minutes: 120
  max_cooldown_minutes: 720
  max_posting_age_days: 14
  empty_run_circuit_breaker: 6


dynamic_searches:
  # Rebuilt from the latest resume roles and strongest skills each run.
  # The static non-always searches below remain as a disabled-mode fallback.
  enabled: true
  role_limit: 4
  site_name: [linkedin, google]
  location: "India"
  is_remote: true
  job_type: fulltime
  hours_old: 72
  results_wanted: 20

resume:
  # Replace either file when your resume changes. Their hashes are checked
  # every run, so Job Radar automatically rebuilds its profile and ranking.
  paths:
    - "/mnt/d/Aman_Singh.pdf"
    - "/mnt/d/Aman_Singh_CV.pdf"
  cache_path: "data/resume_profile.json"

matching:
  minimum_score: 6
  max_alerts_per_run: 10
  pending_expiry_days: 7
  maximum_required_years: 5
  minimum_salary: 0
  company_blacklist: []
  company_allowlist: []
  allowed_countries: [India]
  seniority_penalty_terms: [senior, lead]
  excluded_title_terms:
    - intern
    - internship
    - frontend
    - front-end
    - wordpress
    - sales
    - support engineer
    - technical support
    - principal
    - staff engineer
    - engineering manager
    - architect

aman_os:
  # Job Radar remains the discovery source; Aman OS receives matched jobs for
  # role-specific preparation. Credentials stay only in .env.
  enabled: true
  batch_size: 50
  timeout_seconds: 20

monitoring:
  # Alert once per outage streak, after all selected providers have failed
  # this many consecutive scheduled runs.
  all_provider_failure_alert_runs: 3
  # Alert once per provider failure streak, even when other providers succeed.
  provider_failure_alert_runs: 3

backups:
  # SQLite contains application history as well as scraper state.
  enabled: true
  path: "data/backups"
  retention_days: 14

applications:
  enabled: true
  stale_after_days: 7
  reminder_interval_hours: 24
  max_reminders_per_message: 10

semantic:
  # Optional second-stage scoring for borderline jobs. When enabled, only a
  # compact roles/skills profile and limited job text are sent to OpenAI.
  enabled: false
  model: text-embedding-3-small
  borderline_min_score: 4
  borderline_max_score: 8
  minimum_similarity: 0.45
  maximum_bonus: 4
  max_jobs_per_run: 10
  fail_open: true

external_sources:
  # These adapters are intentionally slower than the 30-minute JobSpy loop.
  # Each source records its last attempt and only runs at its own interval.
  enabled: true
  timeout_seconds: 30
  user_agent: "JobRadar/1.0 personal job search"
  cooldown_minutes: 120
  max_cooldown_minutes: 720
  sources:
    hn_whos_hiring:
      enabled: true
      interval_hours: 12
      max_comments: 150

    cutshort:
      enabled: true
      interval_hours: 6
      max_results_per_page: 15
      pages:
        - "https://cutshort.io/jobs/api-jobs"
        - "https://cutshort.io/jobs/remote-golang-jobs"
        - "https://cutshort.io/jobs/remote-python-jobs"
        - "https://cutshort.io/jobs/remote-machine-learning-ml-jobs"

    hirist:
      enabled: true
      interval_hours: 6
      max_results_per_category: 20
      categories:
        - name: backend
          page_url: "https://www.hirist.tech/c/backend-development-jobs"
        - name: ai_ml
          page_url: "https://www.hirist.tech/c/ai-ml-jobs"

    ats_apis:
      enabled: true
      interval_hours: 6

    discovery:
      enabled: true
      interval_hours: 6

ats_companies:
  - name: "Postman"
    provider: "lever"
    slug: "postman"
  - name: "Stripe"
    provider: "greenhouse"
    slug: "stripe"
  - name: "Linear"
    provider: "ashby"
    slug: "linear"

searches:
  # Resume-aligned backend searches.
  - name: python_fastapi_backend_li_google
    site_name: [linkedin, google]
    search_term: "Python backend engineer FastAPI"
    google_search_term: "Python FastAPI backend engineer jobs India remote"
    location: "India"
    is_remote: true
    job_type: fulltime
    hours_old: 72
    results_wanted: 20

  - name: golang_aws_backend_li_google
    site_name: [linkedin, google]
    search_term: "Golang backend engineer AWS"
    google_search_term: "Golang backend AWS engineer jobs India remote"
    location: "India"
    is_remote: true
    job_type: fulltime
    hours_old: 72
    results_wanted: 20

  - name: platform_devops_li_google
    site_name: [linkedin, google]
    search_term: "platform engineer Docker AWS Linux"
    google_search_term: "platform engineer Docker AWS jobs India remote"
    location: "India"
    is_remote: true
    job_type: fulltime
    hours_old: 72
    results_wanted: 20

  - name: django_microservices_li_google
    site_name: [linkedin, google]
    search_term: "Django microservices backend engineer"
    google_search_term: "Django microservices backend jobs India remote"
    location: "India"
    is_remote: true
    job_type: fulltime
    hours_old: 72
    results_wanted: 20

  # Indeed: no hours_old (conflicts with job_type/is_remote), country_indeed
  # is required. The boolean query reflects the resume's backend profile.
  - name: backend_indeed
    always_run: true
    site_name: [indeed]
    search_term: 'backend engineer (golang OR python OR FastAPI OR Django OR AWS) fulltime remote'
    location: "India"
    country_indeed: "India"
    is_remote: true
    job_type: fulltime
    results_wanted: 30
